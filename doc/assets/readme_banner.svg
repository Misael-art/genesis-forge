<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">SGDK Forge</title>
  <desc id="desc">Engenharia e criação para Mega Drive e Genesis. Tipografia clara sobre fundo azul escuro, com um emblema geométrico em verde e laranja.</desc>
