    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8cb8dd" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#background)"/>
